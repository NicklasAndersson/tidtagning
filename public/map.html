<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karta</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/app.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; }
  #map { flex: 1; }
  #map.leaflet-container { border-radius: 0; }
  #status { position: absolute; top: 4.25rem; left: 50%; transform: translateX(-50%); z-index: 900; background: #fff; padding: 0.4rem 0.9rem; border-radius: 999px; box-shadow: 0 1px 4px #0003; font-size: 0.9rem; }
  #status:empty { display: none; }
</style>
</head>
<body>
<script src="/nav.js"></script>
<div id="status"></div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-gpx@1.7.0/gpx.js"></script>
<script src="/livemap.js"></script>
<script>
initLiveMap('map', { onNoGpx: () => document.getElementById('status').textContent = 'Inget GPX-spår uppladdat än.' });
</script>
</body>
</html>
